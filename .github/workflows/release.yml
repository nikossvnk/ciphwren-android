name: Release

# Builds the signed app and publishes it as a GitHub release when a version tag is pushed:
#   git tag v3.0.0 && git push origin v3.0.0
# The tag must match versionName in app/build.gradle.kts.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   the release keystore, encoded with: base64 -w0 release.jks
#   RELEASE_STORE_PASSWORD    the password of the keystore
#   RELEASE_KEY_ALIAS         the alias of the key in the keystore
#   RELEASE_KEY_PASSWORD      the password of the key

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      # To create the release
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check that the release key is configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Without it the release APK would be unsigned
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              exit 1
            fi
          done

      - name: Check that the tag matches the version of the app
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match versionName $version"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Do not restore build outputs or persist signing configuration.
          cache-disabled: true

      - name: Install Android and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
          (cd etebase-java && rustup show active-toolchain)

      - name: Write the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew build --no-build-cache --no-configuration-cache -PreleaseStoreFile="$RUNNER_TEMP/release.jks"

      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check that the app is signed with the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The app is signed with the debug key"
            exit 1
          fi

      - name: Check the native libraries of the app
        run: scripts/check-apk-native-libs.sh app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ciphwren-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
