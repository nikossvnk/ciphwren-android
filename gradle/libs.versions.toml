[versions]
agp = "9.5.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
acra = "5.14.2"
okhttp = "5.5.1"
lifecycle = "2.11.0"

[libraries]
desugar-jdk-libs = "com.android.tools:desugar_jdk_libs:2.1.5"
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
acra-http = { module = "ch.acra:acra-http", version.ref = "acra" }
acra-dialog = { module = "ch.acra:acra-dialog", version.ref = "acra" }
androidx-activity-ktx = "androidx.activity:activity-ktx:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-coordinatorlayout = "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
androidx-core-ktx = "androidx.core:core-ktx:1.19.1"
androidx-drawerlayout = "androidx.drawerlayout:drawerlayout:1.2.0"
androidx-fragment-ktx = "androidx.fragment:fragment-ktx:1.9.1"
androidx-preference-ktx = "androidx.preference:preference-ktx:1.2.1"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-viewpager2 = "androidx.viewpager2:viewpager2:1.1.0"
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
material = "com.google.android.material:material:1.14.0"
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
junit = "junit:junit:4.13.2"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-runner = "androidx.test:runner:1.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
